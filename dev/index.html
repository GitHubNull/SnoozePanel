<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnoozePanel 本地实测台</title>
  <!-- 内联空图标：抑制浏览器默认 /favicon.ico 请求，保证控制台零报错 -->
  <link rel="icon" href="data:," />
  <!--
    本地实测台（静态服务器直开，无构建步骤）：
      python -m http.server 8765  →  http://127.0.0.1:8765/dev/

    页面布局（设计软件式：上中下 + 左中右，整页占满视口，无水平留白）：
      - 上（顶栏）：品牌 / 状态徽章 / 运行时操作（挂载·重新应用·触发·退出·卸载·重载产物）
      - 中（主内容）：内嵌真实产物编辑器 snooze-panel-editor
                     → 其内部即「左工具栏 / 中预览画布 / 右属性面板」三区
      - 下（底栏）：运行日志 + mock 后端设备（Toast 走右上角浮层）

    逻辑全部在 dev/dev.js（// @ts-check + JSDoc，由 tsconfig.dev.json 做类型检查）。
    配置编辑器直接内嵌真实产物（mountEditor），与 HA 环境完全一致，配置以编辑器为单一来源。
  -->
  <style>
    :root {
      --bg: #0c0f14;
      --card: #151a23;
      --card-2: #1b2130;
      --border: #262f40;
      --text: #e9edf5;
      --dim: #8b95a8;
      --accent: #5ea0ff;
      --accent-soft: rgba(94, 160, 255, 0.14);
      --ok: #4fc07d;
      --warn: #e8b45a;
      --error: #ef6b6b;
      --radius: 14px;
      --radius-sm: 9px;
      --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 500px at 18% -10%, rgba(94, 160, 255, 0.10), transparent 60%),
        radial-gradient(900px 420px at 92% 0%, rgba(122, 92, 255, 0.08), transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ============ 上中下骨架：整页占满视口、无水平留白 ============ */
    .page { max-width: 100%; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ============ 顶栏（上）：全局控件 ============ */
    .topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 20px; background: var(--card); border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .brand h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: 0.3px; }
    .brand h1 .dot { color: var(--accent); }
    .brand p { margin: 0; color: var(--dim); font-size: 13px; }
    .topbar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .badges { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 12px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border);
      font-size: 12.5px; color: var(--dim);
    }
    .badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .badge.ok { color: var(--ok); border-color: rgba(79, 192, 125, 0.35); }
    .badge.warn { color: var(--warn); border-color: rgba(232, 180, 90, 0.35); }
    .badge.error { color: var(--error); border-color: rgba(239, 107, 107, 0.4); }
    .badge.accent { color: var(--accent); border-color: rgba(94, 160, 255, 0.4); }

    /* ============ 主内容区（中）：内嵌真实编辑器（左工具栏 / 中预览 / 右属性） ============ */
    .main-content { flex: 1; min-height: 0; display: flex; overflow: hidden; background: var(--card); }
    .editor-host { flex: 1; min-width: 0; min-height: 0; display: flex; overflow: hidden; }
    /* 自定义元素默认 inline，需显式撑满宿主，编辑器三区外壳才能铺满 */
    .editor-host > snooze-panel-editor { display: block; flex: 1; min-width: 0; min-height: 0; }

    /* ============ 底栏（下）：运行日志 + mock 后端设备 ============ */
    .bottombar { display: flex; gap: 20px; padding: 12px 20px; background: var(--card); border-top: 1px solid var(--border); flex-shrink: 0; max-height: 200px; }
    .bottombar .log-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .bottombar .device-col { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; }
    .bottombar .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .panel-title { font-size: 14px; font-weight: 600; margin: 0; color: var(--text); }

    /* ============ 按钮 ============ */
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 16px; border: 0; border-radius: 8px;
      background: var(--accent); color: #08111f;
      font-size: 13.5px; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: filter 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 500; }
    .btn.ghost:hover { filter: none; border-color: #3a4a63; }
    .btn.small { padding: 6px 12px; font-size: 12.5px; }
    .btn.tiny { padding: 4px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; filter: none; }
    .btn[data-busy="1"] { pointer-events: none; opacity: 0.75; }
    .btn[data-busy="1"]::before {
      content: ''; width: 12px; height: 12px; flex: none;
      border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
      display: inline-block; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dim { color: var(--dim); font-size: 12.5px; }
    code { font-family: var(--mono); background: var(--accent-soft); color: var(--accent); padding: 1px 6px; border-radius: 5px; font-size: 12px; }

    /* ============ 运行日志 ============ */
    .log {
      list-style: none; margin: 0; padding: 10px 12px;
      background: #0a0d13; border: 1px solid var(--border); border-radius: var(--radius-sm);
      flex: 1; min-height: 0; overflow: auto;
      font-family: var(--mono); font-size: 12.5px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .log-line { display: flex; gap: 8px; line-height: 1.5; }
    .log-line .time { flex: none; color: #55617a; }
    .log-line .msg { white-space: pre-wrap; word-break: break-word; }
    .log-line.info .msg { color: #aab4c6; }
    .log-line.ok .msg { color: var(--ok); }
    .log-line.warn .msg { color: var(--warn); }
    .log-line.error .msg { color: var(--error); }

    /* ============ mock 后端设备列表 ============ */
    .device-list {
      list-style: none; margin: 0; padding: 10px 12px;
      background: #0a0d13; border: 1px solid var(--border); border-radius: var(--radius-sm);
      flex: 1; min-height: 0; overflow: auto;
      display: flex; flex-direction: column; gap: 8px; font-size: 13px;
    }
    .device-list li { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .device-list li.dim { justify-content: flex-start; }

    /* ============ Toast（右上角） ============ */
    .toast-stack { position: fixed; top: 18px; right: 18px; z-index: 999; display: flex; flex-direction: column; gap: 10px; width: 320px; }
    .toast {
      background: var(--card-2); border: 1px solid var(--border); border-left: 4px solid var(--accent);
      border-radius: 10px; padding: 10px 14px; cursor: pointer;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
      animation: toast-in 0.22s ease-out;
    }
    .toast.success { border-left-color: var(--ok); }
    .toast.error { border-left-color: var(--error); }
    .toast.warning { border-left-color: var(--warn); }
    .toast-title { font-size: 13.5px; font-weight: 600; }
    .toast-detail { margin-top: 3px; font-size: 12.5px; color: var(--dim); }
    .toast.leave { opacity: 0; transform: translateX(14px); transition: opacity 0.22s, transform 0.22s; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }

    /* ============ 窄屏降级：三区改为纵向堆叠（HA 卡片编辑器等窄容器） ============ */
    @media (max-width: 900px) {
      .bottombar { flex-direction: column; max-height: none; }
      .bottombar .device-col { width: auto; }
      .log { max-height: 160px; }
    }
  </style>
</head>
<body>
  <!-- Toast 容器（右上角轻提示） -->
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

  <div class="page">
    <!-- ============ 顶栏（上）：全局控件 ============ -->
    <header class="topbar">
      <div class="brand">
        <h1>SnoozePanel <span class="dot">本地实测台</span></h1>
        <p>mock hass · 构建产物直载（tmp/dist）· 零外发请求</p>
      </div>
      <div class="topbar-right">
        <div class="badges">
          <span class="badge warn" id="badge-bundle">产物加载中…</span>
          <span class="badge" id="badge-dirty">配置同步中…</span>
          <span class="badge ok" id="badge-backend">mock 后端就绪</span>
          <span class="badge" id="badge-runtime">未挂载</span>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="btn-mount" disabled>挂载运行时</button>
          <button type="button" class="btn ghost" id="btn-reapply" disabled>重新应用配置</button>
          <button type="button" class="btn" id="btn-trigger" disabled>触发屏保</button>
          <button type="button" class="btn ghost" id="btn-exit" disabled>退出屏保</button>
          <button type="button" class="btn ghost" id="btn-unmount" disabled>卸载运行时</button>
          <button type="button" class="btn ghost small" id="btn-reload-bundle" hidden>重新加载产物</button>
        </div>
      </div>
    </header>

    <!-- ============ 主内容区（中）：内嵌真实编辑器（左工具栏 / 中预览画布 / 右属性面板） ============ -->
    <main class="main-content">
      <div class="editor-host" id="editor-host"></div>
    </main>

    <!-- ============ 底栏（下）：运行日志 + mock 后端设备 ============ -->
    <footer class="bottombar">
      <div class="log-col">
        <div class="card-head">
          <h3 class="panel-title">运行日志</h3>
          <button type="button" class="btn ghost small" id="btn-clear-log">清空</button>
        </div>
        <ul class="log" id="log"></ul>
      </div>
      <div class="device-col">
        <div class="card-head">
          <h3 class="panel-title">mock 后端设备</h3>
          <button type="button" class="btn ghost small" id="btn-refresh-devices">刷新</button>
        </div>
        <ul class="device-list" id="device-list">
          <li class="dim">尚未保存任何设备</li>
        </ul>
      </div>
    </footer>
  </div>

  <script type="module" src="./dev.js"></script>
</body>
</html>
