<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="b-title b-desc">
  <title id="b-title">SnoozePanel 宣传头图</title>
  <desc id="b-desc">宣纸浅色风格的 SnoozePanel 品牌头图：一枚模拟表盘与卧月、睡眠意象，右侧为项目名与中文标语「闲置即入静，触摸即归来」，点缀朱砂印章。</desc>
  <defs>
    <!-- 宣纸底色 -->
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9F5EC"/>
      <stop offset="1" stop-color="#EFE6D5"/>
    </linearGradient>
    <!-- 淡墨晕染 -->
    <radialGradient id="wash1" cx="0.18" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#9FB0BF" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#9FB0BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash2" cx="0.82" cy="0.9" r="0.8">
      <stop offset="0" stop-color="#C0A980" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C0A980" stop-opacity="0"/>
    </radialGradient>
    <style>
      .ink { fill: #2A2A2A; }
      .ink-light { fill: #6E6A62; }
      .faint { fill: #9A9384; }
      .verm { fill: #B23A2E; }
      .tick { stroke: #7C776B; stroke-width: 3; stroke-linecap: round; }
      .hand { stroke: #2A2A2A; stroke-linecap: round; }
      .brand { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-weight: 700; }
      .cn { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .zmark { fill: #7E93A6; font-family: Georgia, serif; font-weight: 700; }
    </style>
  </defs>

  <!-- 纸张背景 -->
  <rect width="1200" height="400" fill="url(#paper)"/>
  <rect width="1200" height="400" fill="url(#wash1)"/>
  <rect width="1200" height="400" fill="url(#wash2)"/>

  <!-- 纸纤维颗粒 -->
  <g fill="#2A2A2A" opacity="0.05">
    <circle cx="120" cy="70" r="2"/><circle cx="260" cy="330" r="2.4"/><circle cx="420" cy="96" r="1.8"/>
    <circle cx="520" cy="300" r="2.2"/><circle cx="700" cy="60" r="1.6"/><circle cx="860" cy="340" r="2.4"/>
    <circle cx="980" cy="80" r="2"/><circle cx="1120" cy="300" r="1.8"/><circle cx="180" cy="240" r="1.6"/>
    <circle cx="640" cy="350" r="2"/><circle cx="1040" cy="180" r="1.6"/><circle cx="60" cy="300" r="2"/>
  </g>

  <!-- 内描边框 -->
  <rect x="16" y="16" width="1168" height="368" rx="18" fill="none" stroke="#D8CEBB" stroke-width="1.5" opacity="0.7"/>

  <!-- 左侧：模拟表盘 -->
  <g transform="translate(330 200)">
    <circle r="132" fill="#FBF8F1" stroke="#D8CEBB" stroke-width="3"/>
    <circle r="132" fill="none" stroke="#2A2A2A" stroke-width="1.5" opacity="0.10"/>
    <circle r="118" fill="none" stroke="#2A2A2A" stroke-width="1.5" opacity="0.14"/>
    <!-- 12 刻度 -->
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(0)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(30)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(60)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(90)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(120)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(150)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(180)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(210)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(240)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(270)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(300)"/>
    <line class="tick" x1="0" y1="-132" x2="0" y2="-120" transform="rotate(330)"/>
    <!-- 指针（10:10） -->
    <line class="hand" x1="0" y1="0" x2="-57.2" y2="-33" stroke-width="8"/>
    <line class="hand" x1="0" y1="0" x2="84.9" y2="-49" stroke-width="6"/>
    <circle r="8" fill="#2A2A2A"/>
    <circle r="3.5" fill="#B23A2E"/>
  </g>

  <!-- 卧月 + 睡眠「z」 -->
  <g transform="translate(478 82) scale(2.6) translate(-12 -12)">
    <path d="M12 2A10 10 0 0 0 22 12A8 8 0 0 1 12 2Z" fill="#7E93A6"/>
  </g>
  <text class="zmark" x="516" y="70" font-size="38" opacity="0.9">z</text>
  <text class="zmark" x="548" y="52" font-size="28" opacity="0.75">z</text>
  <text class="zmark" x="574" y="38" font-size="19" opacity="0.6">z</text>

  <!-- 分隔细线 -->
  <line x1="585" y1="92" x2="585" y2="310" stroke="#2A2A2A" stroke-width="1.5" opacity="0.12"/>

  <!-- 右侧文字 -->
  <text class="brand ink" x="614" y="152" font-size="74">SnoozePanel</text>
  <rect x="616" y="170" width="104" height="5" rx="2.5" fill="#B23A2E"/>
  <text class="cn ink-light" x="616" y="216" font-size="27">闲置即入静 · 触摸即归来</text>
  <text class="cn faint" x="616" y="260" font-size="20">时钟 · 日历 · 农历 · 天气 · 自定义文本 · 多主题表盘</text>
  <text class="cn faint" x="616" y="294" font-size="18">Home Assistant 仪表板全屏屏保插件</text>

  <!-- 朱砂印章 -->
  <g transform="translate(1108 300)">
    <rect x="-38" y="-38" width="76" height="76" rx="7" fill="#B23A2E" opacity="0.92"/>
    <text class="cn" x="0" y="9" font-size="27" fill="#F7F2E8" text-anchor="middle">屏息</text>
  </g>
</svg>
